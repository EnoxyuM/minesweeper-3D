<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Minesweeper Adventure</title>
<style>
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden;
    background:#050b18; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; }
  canvas { display:block; width:100vw; height:100vh; }
  #overlay { position:fixed; inset:0; z-index:30; display:grid; place-items:center;
    padding:20px; text-align:center; color:#e2e8f0; background:rgba(2,6,23,.82);
    backdrop-filter:blur(10px); }
  #overlay.hidden { display:none; }
  .overlay-inner { display:flex; flex-direction:column; align-items:center; gap:20px;
    max-height:calc(100vh - 40px); overflow-y:auto; padding:16px; }
  .overlay-title { font-size:clamp(28px, 6vw, 52px); font-weight:900;
    letter-spacing:4px; color:#e2e8f0; margin:0; text-align:center;
    text-shadow: 0 0 20px rgba(140,90,255,1), 0 0 40px rgba(80,40,180,.8); }
  .overlay-intro { white-space:pre-line; font-size:18px; opacity:.9; line-height:1.5; }
  .overlay-rules { white-space:pre-line; color:#00d4ff; font-size:16px;
    font-weight:600; text-shadow:0 0 12px rgba(0,212,255,0.6);
    max-width:520px; line-height:1.6; }
  .overlay-buttons { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .overlay-buttons button { background:linear-gradient(180deg, rgba(140,90,255,.35), rgba(80,40,180,.35));
    color:#fff; border:1px solid rgba(140,90,255,.6); border-radius:10px;
    padding:14px 24px; font-size:16px; font-weight:700; cursor:pointer;
    transition:all .15s; min-width:140px; }
  .overlay-buttons button:hover:not(:disabled) {
    background:linear-gradient(180deg, rgba(160,110,255,.55), rgba(100,60,200,.55));
    box-shadow:0 0 20px rgba(140,90,255,.4); }
  .overlay-buttons button:disabled { opacity:.35; cursor:not-allowed; }

  #hud { position:fixed; top:18px; left:18px; z-index:60;
    color:#e2e8f0; font-size:26px; font-weight:700; letter-spacing:1px;
    text-shadow: 0 0 10px rgba(140,90,255,.9), 0 0 20px rgba(80,40,180,.6);
    pointer-events:none; font-variant-numeric: tabular-nums;
    opacity:0; transition: opacity 0.3s ease; }
  #hud.low { color:#ff8090; text-shadow: 0 0 10px rgba(255,80,120,.9); }

  #score { position:fixed; bottom:24px; left:50%; top:auto;
    z-index:60; color:#e2e8f0; font-size:32px; font-weight:800;
    text-shadow: 0 0 15px rgba(140,90,255,1), 0 0 30px rgba(80,40,180,.8);
    pointer-events:none; opacity:0;
    transform:translateX(-50%) translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-variant-numeric: tabular-nums; }
  #score.visible { opacity:1; transform:translateX(-50%) translateY(0); }

  #fps { position:fixed; top:18px; right:18px; z-index:60;
    color:#a0c8ff; font-size:15px; font-weight:600;
    text-shadow: 0 0 8px rgba(60,120,255,.7); pointer-events:none;
    font-variant-numeric: tabular-nums; opacity:.8; }

  #minimap-wrap { position:fixed; right:18px; top:45px; z-index:60;
    width:140px; height:140px; box-sizing:border-box;
    border-radius:8px; border:1px solid rgba(140,90,255,.4);
    overflow:hidden; background:rgba(10,15,30,0.8); backdrop-filter:blur(4px);
    touch-action:none; cursor:grab; }
  #minimap-wrap:active { cursor:grabbing; }
  #minimap-canvas { width:100%; height:100%; display:block; }
  #minimap-grip { position:absolute; bottom:0; right:0; width:34px; height:34px;
    cursor:nwse-resize; touch-action:none;
    background:linear-gradient(135deg, transparent 50%, rgba(140,90,255,0.9) 50%);
    border-bottom-right-radius:7px; }
  #minimap-resize-overlay { position:fixed; inset:0; z-index:75; display:none;
    touch-action:none; cursor:nwse-resize; background:transparent; }

  #fullscreen-map { position:fixed; inset:0; z-index:80;
    background:rgba(2,6,23,0.95); backdrop-filter:blur(6px);
    touch-action:none; cursor:grab; }
  #fullscreen-map.hidden { display:none; }
  #fullscreen-map:active { cursor:grabbing; }
  #fullscreen-canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

  #menu, #game-over, #info-modal, #saves-modal { position:fixed; inset:0;
    display:grid; place-items:center; color:#e2e8f0;
    background:rgba(2,6,23,.82); backdrop-filter:blur(10px); }
  #menu.hidden, #game-over.hidden, #info-modal.hidden, #saves-modal.hidden { display:none; }
  #menu { z-index:50; }
  #game-over { z-index:50; cursor:pointer; }
  #info-modal { z-index:85; }
  #saves-modal { z-index:86; }

  .panel { background:rgba(15,20,40,.95); padding:28px 34px; border-radius:16px;
    border:1px solid rgba(140,90,255,.45); box-shadow:0 0 40px rgba(80,40,180,.4);
    display:flex; flex-direction:column; gap:18px; min-width:320px; max-width:400px;
    font-size:16px; max-height:90vh; overflow-y:auto; }
  .panel h1, .panel h2 { margin:0 0 6px; text-align:center; font-weight:700; }
  .panel h1 { font-size:32px; color:#ff8090; text-shadow:0 0 12px rgba(255,80,120,.7); }
  .panel h2 { font-size:22px; }
  .panel button { background:linear-gradient(180deg, rgba(140,90,255,.35), rgba(80,40,180,.35));
    color:#fff; border:1px solid rgba(140,90,255,.6); border-radius:10px;
    padding:12px 16px; font-size:16px; font-weight:600; cursor:pointer;
    transition: all .15s; }
  .panel button:hover { background:linear-gradient(180deg, rgba(160,110,255,.55), rgba(100,60,200,.55));
    box-shadow:0 0 20px rgba(140,90,255,.4); }
  .slider-row { display:flex; flex-direction:column; gap:6px; }
  .slider-row label { font-size:14px; opacity:.85; display:flex; justify-content:space-between; }
  .slider-row label span { color:#b8a0ff; font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#8c5aff; }
  .hint { font-size:13px; opacity:.55; text-align:center; margin-top:-6px; }
  .checkbox-row { display:flex; gap:22px; justify-content:center; margin-top:-4px; flex-wrap:wrap; }
  body.desktop .invert-row { display:none; }
  .checkbox-row label { display:flex; align-items:center; gap:8px;
    font-size:15px; opacity:.9; cursor:pointer; user-select:none; }
  .checkbox-row input[type=checkbox] { width:18px; height:18px;
    accent-color:#8c5aff; cursor:pointer; }

  .save-row { display:flex; gap:8px; }
  .save-row .save-load-btn {
    flex:1; text-align:left; font-size:14px; padding:10px 12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .save-row .save-del-btn {
    flex:0 0 auto; padding:8px 14px; font-size:20px; line-height:1;
    background:linear-gradient(180deg, rgba(255,60,80,.35), rgba(180,40,60,.35));
    border:1px solid rgba(255,60,80,.6);
  }
  .save-row .save-del-btn:hover {
    background:linear-gradient(180deg, rgba(255,80,100,.55), rgba(200,60,80,.55));
  }

  #charge-counter { position:fixed; bottom:24px; right:18px; z-index:60;
    color:#00d4ff; font-size:24px; font-weight:800;
    text-shadow: 0 0 12px rgba(0,200,255,0.9), 0 0 20px rgba(0,100,255,0.5);
    pointer-events:none; font-variant-numeric: tabular-nums;
    opacity:1; transition: opacity 0.3s; }
  #charge-counter.low { color:#ff4060; text-shadow: 0 0 12px rgba(255,0,60,1); }
  #charge-counter.hidden { display:none; }
</style>
</head>
<body>
<div id="overlay">
  <div class="overlay-inner">
    <h1 class="overlay-title">MINESWEEPER<br>ADVENTURE</h1>
    <div class="overlay-intro"></div>
    <div class="overlay-rules"></div>
    <div class="overlay-buttons">
      <button id="btn-continue" disabled data-i18n="continue">Continue</button>
      <button id="btn-load-overlay" disabled data-i18n="load">Load</button>
      <button id="btn-newgame" data-i18n="newGame">New Game</button>
    </div>
  </div>
</div>
<div id="hud">5/5 HP</div>
<div id="score">0</div>
<div id="fps">— FPS</div>
<div id="charge-counter" class="hidden">0</div>
<canvas id="canvas"></canvas>

<div id="minimap-wrap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-grip"></div>
</div>
<div id="minimap-resize-overlay"></div>

<div id="fullscreen-map" class="hidden">
  <canvas id="fullscreen-canvas"></canvas>
</div>

<div id="info-modal" class="hidden">
  <div class="panel" style="max-width:500px;">
    <h2 data-i18n="infoTitle">Info</h2>
    <div id="info-content" style="line-height:1.55;"></div>
    <button id="btn-info-ok" data-i18n="ok">OK</button>
  </div>
</div>

<div id="saves-modal" class="hidden">
  <div class="panel" style="max-width:520px; min-width:360px;">
    <h2 data-i18n="savesTitle">Saves</h2>
    <div id="saves-list" style="display:flex; flex-direction:column; gap:8px; max-height:55vh; overflow-y:auto;"></div>
    <button id="btn-saves-close" data-i18n="close">Close</button>
  </div>
</div>

<div id="game-over" class="hidden">
  <div class="panel">
    <h1 data-i18n="gameOver">GAME OVER</h1>
    <p data-i18n="tapToOpenMenu" style="text-align:center;opacity:.8;margin:0">Tap to open menu</p>
  </div>
</div>

<div id="menu" class="hidden">
  <div class="panel">
    <h2 data-i18n="menu">Menu</h2>
    <button id="btn-restart" data-i18n="restart">Restart (New Seed)</button>
    <button id="btn-load-menu" data-i18n="load">Load</button>
    <div class="slider-row">
      <label><span data-i18n="sensX">X Sensitivity</span> <span id="sens-x-val">10.0°</span></label>
      <input type="range" id="sens-x" min="1" max="30" step="0.5" value="10">
    </div>
    <div class="slider-row">
      <label><span data-i18n="sensY">Y Sensitivity</span> <span id="sens-y-val">15.0°</span></label>
      <input type="range" id="sens-y" min="1" max="30" step="0.5" value="15">
    </div>
    <div class="hint" data-i18n="sensHint">How many degrees to tilt the phone for max speed</div>

    <div class="checkbox-row">
      <label><input type="checkbox" id="minimap-chk" checked> <span data-i18n="minimap">Minimap</span></label>
    </div>
    <div class="checkbox-row invert-row">
      <label><input type="checkbox" id="invert-x"> <span data-i18n="invertX">Invert X</span></label>
      <label><input type="checkbox" id="invert-y"> <span data-i18n="invertY">Invert Y</span></label>
    </div>
    <button id="btn-info" data-i18n="info">Info</button>
    <button id="btn-lang">🌐 Auto</button>
    <button id="btn-close" data-i18n="resume">Resume</button>
  </div>
</div>

<script type="module">
"use strict";

// ===========================================================================
//  Language dictionaries
// ===========================================================================
const T = {
  en: {
    overlayIntro: "Tilt phone / mouse to move\nLong press — Menu\nDouble tap in the bottom area — reset tilt",
    overlayRules: "Find inversion charges to invert your ball — tap anywhere except the bottom area\nBlue ball destroys mines but takes damage from empty cells\nSpecial glowing cells can only be destroyed after clearing all mines around them, their destruction saves the progress",
    menu: "Menu",
    restart: "Restart (New Seed)",
    sensX: "X Sensitivity",
    sensY: "Y Sensitivity",
    sensHint: "How many degrees to tilt the phone for max speed",
    minimap: "Minimap",
    invertX: "Invert X",
    invertY: "Invert Y",
    resume: "Resume",
    info: "Info",
    ok: "OK",
    continue: "Continue",
    load: "Load",
    newGame: "New Game",
    close: "Close",
    delete: "Delete",
    savesTitle: "Saves",
    noSaves: "No saves yet",
    gameOver: "GAME OVER",
    tapToOpenMenu: "Tap to open menu",
    infoTitle: "Info",
    progressSaved: "PROGRESS SAVED",
    loadFailed: "Failed to load save",
  },
  ru: {
    overlayIntro: "Управление наклоном телефона/мышкой\nЗажатие — Меню\nДвойной тап в нижней области — обнулить наклон",
    overlayRules: "Найдя инверсионные заряды можно инвертировать шар — тапни в любом месте кроме нижней области\nГолубой шар уничтожает мины но получает урон от клеток без мин\nОсобые сияющие клетки можно разрушить лишь уничтожив все мины вокруг них, их уничтожение сохраняет прогресс",
    menu: "Меню",
    restart: "Заново (новый сид)",
    sensX: "X Чувствительность",
    sensY: "Y Чувствительность",
    sensHint: "Сколько градусов наклонить телефон для макс. скорости",
    minimap: "Мини-карта",
    invertX: "Инвертировать X",
    invertY: "Инвертировать Y",
    resume: "Продолжить",
    info: "Инфо",
    ok: "ОК",
    continue: "Продолжить",
    load: "Загрузить",
    newGame: "Новая игра",
    close: "Закрыть",
    delete: "Удалить",
    savesTitle: "Сохранения",
    noSaves: "Пока нет сохранений",
    gameOver: "КОНЕЦ ИГРЫ",
    tapToOpenMenu: "Нажми, чтобы открыть меню",
    infoTitle: "Информация",
    progressSaved: "ПРОГРЕСС СОХРАНЁН",
    loadFailed: "Не удалось загрузить сохранение",
  }
};

// ===========================================================================
//  Language init
// ===========================================================================
const MS_SETTINGS_KEY = 'msSettings';
const MS_LANG_KEY = 'msLang';
const MS_MINIMAP_SIZE_KEY = 'msMinimapSize';
const BROWSER_LANG = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
let settingsLanguage = 'auto';
try { settingsLanguage = localStorage.getItem(MS_LANG_KEY) || 'auto'; } catch(e) {}
if (settingsLanguage !== 'auto' && settingsLanguage !== 'en' && settingsLanguage !== 'ru') settingsLanguage = 'auto';
let LANG = settingsLanguage === 'auto' ? BROWSER_LANG : settingsLanguage;
let L = T[LANG];

// ===========================================================================
//  Constants
// ===========================================================================
const CELL = 4.0;
const WALL_H = 2.6;
const BALL_R = 0.55;
const MAX_TILT_DEG = 24;
const ACCEL_PER_DEG = 1.05;
const FRICTION = 2.4;
const RESTITUTION = 0.25;
const MAX_SPEED = 13;
const VIEW_RADIUS = 15;
const MSAA = 4;
const SENSOR_FILTER = 0.16;
const CALIB_SAMPLES = 25;
const DEAD_ZONE = 0.05;
const INITIAL_HP = 5;
const SPAWN_CELL_X = 1;
const SPAWN_CELL_Z = 1;
const WALL_TEX_SIZE = 64;
const WALL_TEX_HALF = WALL_TEX_SIZE / 2;
const MAX_PARTICLES = 512;
const MAX_CRYSTALS = 16;

const SPAWN_CLEAR_RADIUS_SQ = 12.25;
const SPAWN_MINE_SAFE_RADIUS_SQ = 25;

const DOUBLE_TAP_MS = 300;
const MIN_DEAD_DEG = 1.5;
const DEAD_FRAC = 0.24;

const CAM_HEIGHT_BASE = 22.0;
const CAM_HEIGHT_TOUCH = 28.0;
const CAM_BACK = 0.0;
const FOV_DEG_BASE = 55;
const FOV_DEG_MAX = 80;
const MIN_HORIZ_CELLS = 4.5;

const WALL_PAD_XZ = 0.02;
const WALL_PAD_DOWN = 0.20;

const ORB_DROP_CHANCE = 0.02;
const SPECIAL_WALL_CHANCE = 0.005;
const SPECIAL_WALL_RADIUS = 10;
const SPECIAL_WALL_MIN_DIST = 3;

const BOTTOM_ZONE_FRAC = 0.15;

const BIOME_PALETTE = [
  [239,  80,  32],
  [ 48, 223, 159],
  [175,  48, 239],
  [239, 207,  64],
  [ 16, 159, 239],
  [239,  32, 112],
  [112, 191,  32],
  [143,  32, 207],
];

const SAVE_MAGIC = 0x4D534144;
const SAVE_VERSION = 1;

let camHeight = CAM_HEIGHT_BASE;
let fovDeg = FOV_DEG_BASE;
let isTouchPrimary = false;
try { isTouchPrimary = window.matchMedia('(pointer: coarse)').matches; } catch(e) {}
if (!isTouchPrimary) document.body.classList.add('desktop');

// ===========================================================================
//  Game state
// ===========================================================================
let SEED = (Math.random() * 0xFFFFFFFF) >>> 0;
const destroyedWalls = new Set();
const visitedCells = new Set();
const tileNumCache = new Map();
const specialWallCache = new Map();
const specialWallFlagCache = new Map();
let hp = INITIAL_HP;
let score = 0;
let scoreVisibleUntil = 0;
let scoreCurrentlyVisible = false;
let hpVisibleUntil = 0;
let hpCurrentlyVisible = false;
let gameOver = false;
let menuVisible = false;
let sensX = 10.0;
let sensY = 15.0;
let invertX = false;
let invertY = false;
let shake = 0;
let globalTime = 0;

let inversionCharges = 0;
let isInverted = false;
let invertFlash = 0;
let infoModalOpen = false;
let savesModalOpen = false;
let bonusOrbs = [];

// ===========================================================================
//  Settings storage
// ===========================================================================
function loadSettingsFromStorage() {
  try {
    const s = JSON.parse(localStorage.getItem(MS_SETTINGS_KEY) || '{}');
    if (typeof s.sensX === 'number' && isFinite(s.sensX)) sensX = Math.max(1, Math.min(30, s.sensX));
    if (typeof s.sensY === 'number' && isFinite(s.sensY)) sensY = Math.max(1, Math.min(30, s.sensY));
    if (typeof s.invertX === 'boolean') invertX = s.invertX;
    if (typeof s.invertY === 'boolean') invertY = s.invertY;
    if (typeof s.minimapVisible === 'boolean') minimapVisible = s.minimapVisible;
    if (typeof s.minimapSize === 'number' && isFinite(s.minimapSize)) minimapSize = Math.max(60, Math.min(300, s.minimapSize));
    if (typeof s.minimapFx === 'number' && isFinite(s.minimapFx)) minimapFx = Math.max(0, Math.min(1, s.minimapFx));
    if (typeof s.minimapFy === 'number' && isFinite(s.minimapFy)) minimapFy = Math.max(0, Math.min(1, s.minimapFy));
    if (typeof s.minimapX === 'number' && isFinite(s.minimapX)) legacyMinimapX = s.minimapX;
    if (typeof s.minimapY === 'number' && isFinite(s.minimapY)) legacyMinimapY = s.minimapY;
  } catch(e) { console.warn('Settings load failed', e); }
  // Отдельный ключ размера — приоритетнее поля в общем JSON.
  try {
    const raw = localStorage.getItem(MS_MINIMAP_SIZE_KEY);
    const v = parseFloat(raw);
    if (raw !== null && isFinite(v)) minimapSize = Math.max(60, Math.min(300, v));
  } catch(e) {}
}
function saveSettingsToStorage() {
  try {
    localStorage.setItem(MS_SETTINGS_KEY, JSON.stringify({
      sensX, sensY, invertX, invertY,
      minimapVisible, minimapSize, minimapFx, minimapFy
    }));
    localStorage.setItem(MS_MINIMAP_SIZE_KEY, String(minimapSize));
  } catch(e) { console.warn('Settings save failed', e); }
}

let minimapVisible = true;
let minimapSize = 140;
// Позиция хранится в долях доступной области (0..1) — переживает поворот экрана.
let minimapFx = null, minimapFy = null;
let legacyMinimapX = null, legacyMinimapY = null;
let mmDrag = null;
let mmResize = null;
let mmSaveTimer = null;
loadSettingsFromStorage();

// ===========================================================================
//  IndexedDB
// ===========================================================================
const DB_NAME = 'minesweeper_adventure';
const DB_STORE = 'saves';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(DB_STORE)) {
        const store = d.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function initDB() {
  try { db = await openDB(); } catch(e) { console.error('IndexedDB init failed:', e); db = null; }
}
function dbPut(record) {
  if (!db) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbAll() {
  if (!db) return Promise.resolve([]);
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(id) {
  if (!db) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(id) {
  if (!db) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ===========================================================================
//  Serialize / deserialize
// ===========================================================================
function serializeState() {
  const dArr = [];
  for (const k of destroyedWalls) {
    const c = k.indexOf(',');
    dArr.push([parseInt(k.slice(0, c), 10), parseInt(k.slice(c + 1), 10)]);
  }
  const vArr = [];
  for (const k of visitedCells) {
    const c = k.indexOf(',');
    vArr.push([parseInt(k.slice(0, c), 10), parseInt(k.slice(c + 1), 10)]);
  }
  const size = 4 + 1 + 4 + 4 + 1 + 2 + 1 + 4 + 4 + 4 + dArr.length * 8 + 4 + vArr.length * 8;
  const buf = new ArrayBuffer(size);
  const dv = new DataView(buf);
  let o = 0;
  dv.setUint32(o, SAVE_MAGIC, true); o += 4;
  dv.setUint8(o, SAVE_VERSION); o += 1;
  dv.setUint32(o, SEED, true); o += 4;
  dv.setUint32(o, score, true); o += 4;
  dv.setUint8(o, hp); o += 1;
  dv.setUint16(o, inversionCharges, true); o += 2;
  dv.setUint8(o, isInverted ? 1 : 0); o += 1;
  dv.setFloat32(o, ball.x, true); o += 4;
  dv.setFloat32(o, ball.z, true); o += 4;
  dv.setUint32(o, dArr.length, true); o += 4;
  for (const [x, z] of dArr) { dv.setInt32(o, x, true); o += 4; dv.setInt32(o, z, true); o += 4; }
  dv.setUint32(o, vArr.length, true); o += 4;
  for (const [x, z] of vArr) { dv.setInt32(o, x, true); o += 4; dv.setInt32(o, z, true); o += 4; }
  return buf;
}

function deserializeState(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const magic = dv.getUint32(o, true); o += 4;
  if (magic !== SAVE_MAGIC) throw new Error('Bad magic');
  const version = dv.getUint8(o); o += 1;
  if (version !== SAVE_VERSION) throw new Error('Unsupported version');
  SEED = dv.getUint32(o, true); o += 4;
  score = dv.getUint32(o, true); o += 4;
  hp = dv.getUint8(o); o += 1;
  inversionCharges = dv.getUint16(o, true); o += 2;
  isInverted = dv.getUint8(o) === 1; o += 1;
  ball.x = dv.getFloat32(o, true); o += 4;
  ball.z = dv.getFloat32(o, true); o += 4;
  destroyedWalls.clear();
  const dCount = dv.getUint32(o, true); o += 4;
  for (let i = 0; i < dCount; i++) {
    const x = dv.getInt32(o, true); o += 4;
    const z = dv.getInt32(o, true); o += 4;
    destroyedWalls.add(`${x},${z}`);
  }
  visitedCells.clear();
  const vCount = dv.getUint32(o, true); o += 4;
  for (let i = 0; i < vCount; i++) {
    const x = dv.getInt32(o, true); o += 4;
    const z = dv.getInt32(o, true); o += 4;
    visitedCells.add(`${x},${z}`);
  }
  tileNumCache.clear();
  specialWallCache.clear();
  specialWallFlagCache.clear();
  particles.length = 0;
  bonusOrbs.length = 0;
  shake = 0;
  gameOver = false;
  scoreCurrentlyVisible = false;
  hpCurrentlyVisible = false;
  invertFlash = 0;
  ball.vx = 0; ball.vz = 0;
  lastTexCellX = null; lastTexCellZ = null; lastTexDestroyedCount = -1;
  lastBiomeCX = null; lastBiomeCZ = null; biomeVersion++;
  document.getElementById("score").textContent = score;
  scoreVisibleUntil = performance.now() + 3000;
  updateHp(true);
  updateChargeUI();
  document.getElementById("game-over").classList.add("hidden");
}

function formatSaveName(sc, ts) {
  const d = new Date(ts);
  const months = LANG === 'ru'
    ? ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = d.getDate();
  const month = months[d.getMonth()];
  const year = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `Score: ${sc}, ${day} ${month} ${year} ${hh}:${mm}`;
}

    await dbPut({ score, timestamp: ts, data });

}

// Зонд для чтения safe-area (вырезы/чёлки, viewport-fit=cover)
const mmSafeProbe = document.createElement("div");
mmSafeProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
  "padding-left:env(safe-area-inset-left);padding-top:env(safe-area-inset-top);" +
  "padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);";
document.body.appendChild(mmSafeProbe);
let mmSafeInsets = { left:0, top:0, right:0, bottom:0 };
function refreshMinimapSafeInsets() {
  const cs = getComputedStyle(mmSafeProbe);
  mmSafeInsets = {
    left: parseFloat(cs.paddingLeft) || 0,
    top: parseFloat(cs.paddingTop) || 0,
    right: parseFloat(cs.paddingRight) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0
  };
}

function getMinimapBounds() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const mL = 18 + mmSafeInsets.left;
  const mR = 18 + mmSafeInsets.right;
  const mT = 45 + mmSafeInsets.top;
  const mB = 18 + mmSafeInsets.bottom;
  const maxSize = Math.max(60, Math.min(300, vw - mL - mR, vh - mT - mB));
  return { vw, vh, mL, mR, mT, mB, maxSize };
}

function minimapFractionsFromPixel(left, top, size, b) {
  const maxLeft = b.vw - size - b.mR;
  const maxTop = b.vh - size - b.mB;
  const spanX = Math.max(1e-6, maxLeft - b.mL);
  const spanY = Math.max(1e-6, maxTop - b.mT);
  return {
    fx: Math.max(0, Math.min(1, (left - b.mL) / spanX)),
    fy: Math.max(0, Math.min(1, (top - b.mT) / spanY))
  };
}

// Единственная точка применения позиции/размера: всегда клампится в экран.
function layoutMinimap() {
  const b = getMinimapBounds();
  minimapSize = Math.round(Math.max(60, Math.min(minimapSize, b.maxSize)));
  if (minimapFx === null || minimapFy === null) { minimapFx = 1; minimapFy = 0; }
  minimapFx = Math.max(0, Math.min(1, minimapFx));
  minimapFy = Math.max(0, Math.min(1, minimapFy));
  const maxLeft = b.vw - minimapSize - b.mR;
  const maxTop = b.vh - minimapSize - b.mB;
  const left = b.mL + minimapFx * Math.max(0, maxLeft - b.mL);
  const top = b.mT + minimapFy * Math.max(0, maxTop - b.mT);
  minimapWrap.style.right = "auto";
  minimapWrap.style.left = left + "px";
  minimapWrap.style.top = top + "px";
  minimapWrap.style.width = minimapSize + "px";
  minimapWrap.style.height = minimapSize + "px";
  minimapWrap.style.transform = "";
  minimapWrap.style.transformOrigin = "";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.max(1, Math.round(minimapSize * dpr));
  if (minimapCanvas.width !== px || minimapCanvas.height !== px) {
    minimapCanvas.width = px;
    minimapCanvas.height = px;
  }
  minimapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

refreshMinimapSafeInsets();
// Миграция со старых пиксельных координат (могли быть отрицательными/за экраном)
if ((minimapFx === null || minimapFy === null) && legacyMinimapX !== null && legacyMinimapY !== null) {
  const b = getMinimapBounds();
  const size = Math.max(60, Math.min(minimapSize, b.maxSize));
  const f = minimapFractionsFromPixel(legacyMinimapX, legacyMinimapY, size, b);
  minimapFx = f.fx; minimapFy = f.fy;
}
legacyMinimapX = null; legacyMinimapY = null;
layoutMinimap();
minimapWrap.style.display = minimapVisible ? "block" : "none";

let audioCtx = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  const len = audioCtx.sampleRate * 2;
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const white = Math.random() * 2 - 1;
    last = 0.7 * last + 0.3 * white;
    data[i] = last;
  }
  rollSource = audioCtx.createBufferSource();
  rollSource.buffer = noiseBuffer;
  rollSource.loop = true;
  rollFilter = audioCtx.createBiquadFilter();
  rollFilter.type = "bandpass";
  rollFilter.frequency.value = 220;
  rollFilter.Q.value = 1.3;
  rollGain = audioCtx.createGain();
  rollGain.gain.value = 0;
  rollSource.connect(rollFilter).connect(rollGain).connect(audioCtx.destination);
  rollSource.start();
}
function updateRollSound(speed, dt, active) {
  if (!audioCtx) return;
  smoothSpeed += (speed - smoothSpeed) * Math.min(1, dt * 12);
  const sp = Math.min(smoothSpeed / MAX_SPEED, 1);
  const targetGain = active ? sp * 0.02 : 0;
  const targetFreq = 200 + sp * 600;
  rollGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.06);
  rollFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.06);
}

// ===========================================================================
//  Hash & noise
// ===========================================================================
function hashSeed(x, z, s) {
  let h = (Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(s, 2654435761)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) | 0;
  return h >>> 0;
}
function valueNoise2D(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const s = SEED;
  const n00 = (hashSeed(ix, iz, s) & 0xFFFF) / 65535;
  const n10 = (hashSeed(ix + 1, iz, s) & 0xFFFF) / 65535;
  const n01 = (hashSeed(ix, iz + 1, s) & 0xFFFF) / 65535;
  const n11 = (hashSeed(ix + 1, iz + 1, s) & 0xFFFF) / 65535;
  const a = n00 + (n10 - n00) * ux;
  const b = n01 + (n11 - n01) * ux;
  return a + (b - a) * uz;
}
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// ===========================================================================
//  Wall & mine generation
// ===========================================================================
function isSolidRaw(x, z) {
  const sdx = x - SPAWN_CELL_X;
  const sdz = z - SPAWN_CELL_Z;
  if (sdx * sdx + sdz * sdz <= SPAWN_CLEAR_RADIUS_SQ) return false;
  const cluster = valueNoise2D(x * 0.13, z * 0.13);
  const prob = 0.02 + smoothstep(0.28, 0.85, cluster) * 0.85;
  const r = (hashSeed(x, z, (SEED ^ 0xF00D) >>> 0) & 0xFFFF) / 65535;
  return r < prob;
}
function isSolidWithDestroyed(x, z) {
  if (destroyedWalls.has(`${x},${z}`)) return false;
  return isSolidRaw(x, z);
}
function isSpecialWall(x, z) {
  const key = `${x},${z}`;
  let v = specialWallFlagCache.get(key);
  if (v === undefined) {
    v = computeIsSpecialWall(x, z);
    specialWallFlagCache.set(key, v);
  }
  return v;
}
function computeIsSpecialWall(x, z) {
  if (!isSolidRaw(x, z)) return false;
  if (Math.abs(x - SPAWN_CELL_X) < 3 && Math.abs(z - SPAWN_CELL_Z) < 3) return false;
  const h = hashSeed(x, z, (SEED ^ 0x5EED) >>> 0);
  if ((h & 1023) >= 5) return false;
  for (let dz = -SPECIAL_WALL_MIN_DIST; dz <= SPECIAL_WALL_MIN_DIST; dz++) {
    for (let dx = -SPECIAL_WALL_MIN_DIST; dx <= SPECIAL_WALL_MIN_DIST; dx++) {
      if (dx === 0 && dz === 0) continue;
      const nx = x + dx, nz = z + dz;
      if (!isSolidRaw(nx, nz)) continue;
      const nh = hashSeed(nx, nz, (SEED ^ 0x5EED) >>> 0);
      if ((nh & 1023) >= 5) continue;
      if (nx < x || (nx === x && nz < z)) return false;
    }
  }
  return true;
}
function getMinesNear(x, z) {
  const key = `${x},${z}`;
  if (specialWallCache.has(key)) return specialWallCache.get(key);
  let count = 0;
  for (let dz = -SPECIAL_WALL_RADIUS; dz <= SPECIAL_WALL_RADIUS; dz++) {
    for (let dx = -SPECIAL_WALL_RADIUS; dx <= SPECIAL_WALL_RADIUS; dx++) {
      const wx = x + dx, wz = z + dz;
      if (destroyedWalls.has(`${wx},${wz}`)) continue;
      if (hasMineRaw(wx, wz)) count++;
    }
  }
  specialWallCache.set(key, count);
  return count;
}
function getInitialMinesNear(x, z) {
  let count = 0;
  for (let dz = -SPECIAL_WALL_RADIUS; dz <= SPECIAL_WALL_RADIUS; dz++) {
    for (let dx = -SPECIAL_WALL_RADIUS; dx <= SPECIAL_WALL_RADIUS; dx++) {
      if (hasMineRaw(x + dx, z + dz)) count++;
    }
  }
  return count;
}
function hasMineRaw(x, z) {
  if (isSpecialWall(x, z)) return false;
  const sdx = x - SPAWN_CELL_X;
  const sdz = z - SPAWN_CELL_Z;
  if (sdx * sdx + sdz * sdz <= SPAWN_MINE_SAFE_RADIUS_SQ) return false;
  if (!isSolidRaw(x, z)) return false;
  const cluster = valueNoise2D(x * 0.1 + 200, z * 0.1 + 200);
  if (cluster < 0.3) return false;
  const prob = 0.15 + smoothstep(0.3, 0.75, cluster) * 0.6;
  const r = (hashSeed(x, z, (SEED ^ 0xCAFE) >>> 0) & 0xFFFF) / 65535;
  return r < prob;
}
function wallHasMine(x, z) {
  if (destroyedWalls.has(`${x},${z}`)) return false;
  return hasMineRaw(x, z);
}
function tileNumber(x, z) {
  let n = 0;
  if (wallHasMine(x-1, z  )) n++;
  if (wallHasMine(x+1, z  )) n++;
  if (wallHasMine(x  , z-1)) n++;
  if (wallHasMine(x  , z+1)) n++;
  if (wallHasMine(x-1, z-1)) n++;
  if (wallHasMine(x+1, z-1)) n++;
  if (wallHasMine(x-1, z+1)) n++;
  if (wallHasMine(x+1, z+1)) n++;
  return n;
}
function tileNumberCached(x, z) {
  const key = `${x},${z}`;
  let v = tileNumCache.get(key);
  if (v === undefined) {
    v = tileNumber(x, z);
    tileNumCache.set(key, v);
  }
  return v;
}

function showFloatingText(wx, wy, wz, text, color, sx = 0, sy = 0) {
  const aspect = canvas.width / canvas.height;
  const eye = { x: ball.x, y: BALL_R + camHeight, z: ball.z + CAM_BACK };
  const target = { x: ball.x, y: BALL_R, z: ball.z };
  const { v, p } = buildViewProj(eye, target, aspect);

  const vv = [
    v[0]*wx + v[4]*wy + v[8]*wz + v[12],
    v[1]*wx + v[5]*wy + v[9]*wz + v[13],
    v[2]*wx + v[6]*wy + v[10]*wz + v[14],
    v[3]*wx + v[7]*wy + v[11]*wz + v[15]
  ];
  const pv = [
    p[0]*vv[0] + p[4]*vv[1] + p[8]*vv[2] + p[12]*vv[3],
    p[1]*vv[0] + p[5]*vv[1] + p[9]*vv[2] + p[13]*vv[3],
    p[2]*vv[0] + p[6]*vv[1] + p[10]*vv[2] + p[14]*vv[3],
    p[3]*vv[0] + p[7]*vv[1] + p[11]*vv[2] + p[15]*vv[3]
  ];
  if (pv[3] <= 0) return;

  const rawX = (pv[0] / pv[3] * 0.5 + 0.5) * window.innerWidth + sx;
  const rawY = (-pv[1] / pv[3] * 0.5 + 0.5) * window.innerHeight + sy;

  const padX = Math.max(110, Math.min(window.innerWidth, window.innerHeight) * 0.2);
  const padY = 70;
  const screenX = Math.max(padX, Math.min(window.innerWidth - padX, rawX));
  const screenY = Math.max(padY, Math.min(window.innerHeight - padY, rawY));

  const el = document.createElement("div");
  el.textContent = text;
  el.style.position = "fixed";
  el.style.left = screenX + "px";
  el.style.top = screenY + "px";
  el.style.color = color;
  el.style.fontSize = "clamp(16px, 4.5vw, 26px)";
  el.style.fontWeight = "800";
  el.style.fontFamily = "system-ui, -apple-system, sans-serif";
  el.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
  el.style.pointerEvents = "none";
  el.style.zIndex = "70";
  el.style.whiteSpace = "nowrap";
  el.style.transform = "translate(-50%, -50%)";
  el.style.transition = "transform 5s ease-out, opacity 5s ease-out";

  document.body.appendChild(el);
  el.offsetHeight;
  el.style.transform = "translate(-50%, -200%)";
  el.style.opacity = "0";
  setTimeout(() => el.remove(), 5000);
}

function spawnParticle(x, y, z, vx, vy, vz, size, r, g, b, life) {

    }
  } else {

        Math.cos(ang) * spd, vy, Math.sin(ang) * spd, 0.10 + Math.random() * 0.14, 0.80, 0.80, 0.85, 0.6 + Math.random() * 0.5);

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vy -= 14 * dt;
    const damp = Math.exp(-1.2 * dt);
    p.vx *= damp; p.vz *= damp;
    if (p.y < p.size * 0.5) {
      p.y = p.size * 0.5;
      p.vy *= -0.3;
      p.vx *= 0.7;
      p.vz *= 0.7;
    }
  }
}

const ball = { x: CELL * (SPAWN_CELL_X + 0.5), z: CELL * (SPAWN_CELL_Z + 0.5), vx: 0, vz: 0 };
let ballRot = [1,0,0, 0,1,0, 0,0,1];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function collidesAt(bx, bz) {
  const R = BALL_R;
  const x0 = Math.floor((bx - R) / CELL) - 1, x1 = Math.floor((bx + R) / CELL) + 1;
  const z0 = Math.floor((bz - R) / CELL) - 1, z1 = Math.floor((bz + R) / CELL) + 1;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    if (!isSolidWithDestroyed(x, z)) continue;
    const nx = clamp(bx, x*CELL, (x+1)*CELL), nz = clamp(bz, z*CELL, (z+1)*CELL);
    const dx = bx-nx, dz = bz-nz;
    if (dx*dx + dz*dz < R*R) return true;
  }
  return false;
}

function addScore(amount) {

function breakWall(x, z) {
  const key = `${x},${z}`;
  if (destroyedWalls.has(key)) return;

  if (isSpecialWall(x, z)) {
    const mineCount = getMinesNear(x, z);
    if (mineCount > 0) return;
    destroyedWalls.add(key);
    const initialMines = getInitialMinesNear(x, z);
    const scoreGain = initialMines * 30;
    addScore(scoreGain);
    hp = Math.min(INITIAL_HP, hp + 1);
    updateHp();
    playExplosionSound();
    spawnBreakParticles(x, z, false, true);
    const wx = (x + 0.5) * CELL;
    const wy = WALL_H + 0.5;
    const wz = (z + 0.5) * CELL;
    showFloatingText(wx, wy, wz, "+1 HP", "#30ff70", 0, -55);
    showFloatingText(wx, wy, wz, "+" + scoreGain + " Score", "#ffd700", 0, 0);
    showFloatingText(wx, wy, wz, L.progressSaved, "#00d4ff", 0, 55);
    saveGame();
    specialWallCache.clear();
    return;
  }

  destroyedWalls.add(key);
  tileNumCache.delete(`${x},${z}`);
  tileNumCache.delete(`${x-1},${z}`);
  tileNumCache.delete(`${x+1},${z}`);
  tileNumCache.delete(`${x},${z-1}`);
  tileNumCache.delete(`${x},${z+1}`);
  tileNumCache.delete(`${x-1},${z-1}`);
  tileNumCache.delete(`${x+1},${z-1}`);
  tileNumCache.delete(`${x-1},${z+1}`);
  tileNumCache.delete(`${x+1},${z+1}`);

  const isMine = hasMineRaw(x, z);
  if (isMine) specialWallCache.clear();

  if (isInverted) {
    if (isMine) {
      inversionCharges--;
      if (inversionCharges <= 0) { inversionCharges = 0; isInverted = false; }
      updateChargeUI();
      addScore(10);
      playExplosionSound();
      shake = Math.max(shake, 0.5);
    } else {
      hp = Math.max(0, hp - 1);
      updateHp();
      playBreakSound();
      if (hp <= 0) {
        gameOver = true;
        ball.vx = 0; ball.vz = 0;
        document.getElementById("game-over").classList.remove("hidden");
      }
    }
  } else {
    if (isMine) {
      hp = Math.max(0, hp - 1);
      updateHp();
      playExplosionSound();
      shake = Math.max(shake, 0.5);
      if (hp <= 0) {
        gameOver = true;
        ball.vx = 0; ball.vz = 0;
        document.getElementById("game-over").classList.remove("hidden");
      }
    } else {
      addScore(1);
      playBreakSound();
      if (Math.random() < ORB_DROP_CHANCE) {
        bonusOrbs.push({ x: (x + 0.5) * CELL, z: (z + 0.5) * CELL, t: 0 });
      }
    }
  }
  spawnBreakParticles(x, z, isMine);
}

function checkWallBreak() {
  const R = BALL_R + 0.06;
  const cx = Math.floor(ball.x / CELL);
  const cz = Math.floor(ball.z / CELL);
  let bestWx = 0, bestWz = 0, bestDist = R;
  let found = false;
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const wx = cx + dx, wz = cz + dz;
    if (!isSolidWithDestroyed(wx, wz)) continue;
    if (isSpecialWall(wx, wz)) {
      const count = getMinesNear(wx, wz);
      if (count > 0) continue;
    }
    const nx = clamp(ball.x, wx*CELL, (wx+1)*CELL);
    const nz = clamp(ball.z, wz*CELL, (wz+1)*CELL);
    const ddx = ball.x - nx, ddz = ball.z - nz;
    const d = Math.hypot(ddx, ddz);
    if (d < R && d < bestDist) {
      bestDist = d; bestWx = wx; bestWz = wz; found = true;
    }
  }
  if (found) breakWall(bestWx, bestWz);
}

function stepBall(dt) {
  checkWallBreak();
  for (let i = bonusOrbs.length - 1; i >= 0; i--) {
    const orb = bonusOrbs[i];
    orb.t += dt;
    if (Math.hypot(ball.x - orb.x, ball.z - orb.z) < BALL_R + 0.5) {
      bonusOrbs.splice(i, 1);
      const charges = Math.floor(Math.random() * 21) + 10;
      inversionCharges += charges;
      updateChargeUI();
      playPickupSound();
    }
  }
  const t = currentTilt();
  ball.vx += t.tx * ACCEL_PER_DEG * dt;
  ball.vz += t.ty * ACCEL_PER_DEG * dt;
  const damp = Math.exp(-FRICTION * dt);
  ball.vx *= damp; ball.vz *= damp;
  const sp = Math.hypot(ball.vx, ball.vz);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED/sp; ball.vz *= MAX_SPEED/sp; }
  const steps = 4, sdt = dt/steps;
  for (let i=0;i<steps;i++){
    const nx = ball.x + ball.vx*sdt;
    if (collidesAt(nx, ball.z)) ball.vx = -ball.vx*RESTITUTION; else ball.x = nx;
    const nz = ball.z + ball.vz*sdt;
    if (collidesAt(ball.x, nz)) ball.vz = -ball.vz*RESTITUTION; else ball.z = nz;
  }
  const speed = Math.hypot(ball.vx, ball.vz);
  if (speed > 1e-4) {
    const axis = { x: ball.vz/speed, y: 0, z: -ball.vx/speed };
    ballRot = mulMat3(axisAngleMat3(axis, speed*dt/BALL_R), ballRot);
  }
}

// ===========================================================================
//  Math
// ===========================================================================
function norm3(v){ const l=Math.hypot(v.x,v.y,v.z); return l<1e-9?null:{x:v.x/l,y:v.y/l,z:v.z/l}; }
const dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross3=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
function identMat3(){ return [1,0,0, 0,1,0, 0,0,1]; }
function axisAngleMat3(ax,ang){
  const x=ax.x,y=ax.y,z=ax.z,c=Math.cos(ang),s=Math.sin(ang),t=1-c;
  return [t*x*x+c, t*x*y-s*z, t*x*z+s*y,
          t*x*y+s*z, t*y*y+c, t*y*z-s*x,
          t*x*z-s*y, t*y*z+s*x, t*z*z+c];
}
function mulMat3(a,b){
  const o=new Array(9);
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)
    o[r*3+c]=a[r*3+0]*b[0*3+c]+a[r*3+1]*b[1*3+c]+a[r*3+2]*b[2*3+c];
  return o;
}
function matFromTo(f,t){
  const a=norm3(f), b=norm3(t);
  if(!a||!b) return identMat3();
  const d=clamp(dot3(a,b),-1,1);
  if(d>0.99999) return identMat3();
  if(d<-0.99999) return axisAngleMat3({x:1,y:0,z:0},Math.PI);
  const ax=norm3(cross3(a,b));
  return ax?axisAngleMat3(ax,Math.acos(d)):identMat3();
}
function applyMat3(m,v){
  return { x:m[0]*v.x+m[1]*v.y+m[2]*v.z,
           y:m[3]*v.x+m[4]*v.y+m[5]*v.z,
           z:m[6]*v.x+m[7]*v.y+m[8]*v.z };
}
const validXYZ=o=>o&&Number.isFinite(o.x)&&Number.isFinite(o.y)&&Number.isFinite(o.z);

// ===========================================================================
//  Sensor
// ===========================================================================
const sensorState = { motionEnabled:false, hasAccel:false, baseSet:false, samples:[],
  accel:{x:0,y:0,z:0}, baseMatrix:null, baseTargetZ:1 };

function onMotion(ev){
  if(!sensorState.motionEnabled) return;
  const g=ev.accelerationIncludingGravity;
  if(!validXYZ(g)) return;
  if(!sensorState.hasAccel){ sensorState.accel={x:g.x,y:g.y,z:g.z}; sensorState.hasAccel=true; }
  else{
    sensorState.accel.x+=(g.x-sensorState.accel.x)*SENSOR_FILTER;
    sensorState.accel.y+=(g.y-sensorState.accel.y)*SENSOR_FILTER;
    sensorState.accel.z+=(g.z-sensorState.accel.z)*SENSOR_FILTER;
  }
  if(!sensorState.baseSet){
    sensorState.samples.push({x:sensorState.accel.x,y:sensorState.accel.y,z:sensorState.accel.z});
    if(sensorState.samples.length>=CALIB_SAMPLES){
      let sx=0,sy=0,sz=0;
      for(const s of sensorState.samples){sx+=s.x;sy+=s.y;sz+=s.z;}
      const n=sensorState.samples.length, av=norm3({x:sx/n,y:sy/n,z:sz/n});
      if(av){
        const tz=av.z>=0?1:-1;
        sensorState.baseTargetZ=tz;
        sensorState.baseMatrix=matFromTo(av,{x:0,y:0,z:tz});
        sensorState.baseSet=true;
      }
      sensorState.samples=[];
    }
  }
}
function sensorTilt(){
  if(!sensorState.hasAccel||!sensorState.baseSet||!sensorState.baseMatrix) return null;
  const c=norm3(sensorState.accel); if(!c) return null;
  const v=applyMat3(sensorState.baseMatrix,c);
  const sx=clamp(-v.x*sensorState.baseTargetZ,-1,1);
  const sy=clamp( v.y*sensorState.baseTargetZ,-1,1);
  return { tx: Math.asin(sx)*180/Math.PI, ty: Math.asin(sy)*180/Math.PI };
}
function recalibrateTilt() {
  if (!sensorState.hasAccel) return;
  const c = norm3(sensorState.accel);
  if (!c) return;
  const tz = c.z >= 0 ? 1 : -1;
  sensorState.baseTargetZ = tz;
  sensorState.baseMatrix = matFromTo(c, {x: 0, y: 0, z: tz});
  sensorState.baseSet = true;
  ball.vx = 0;
  ball.vz = 0;
}
const mouse={x:0,y:0,active:false};
window.addEventListener("mousemove", e=>{
  mouse.x=(e.clientX/window.innerWidth -0.5)*2;
  mouse.y=(e.clientY/window.innerHeight-0.5)*2;
  mouse.active=true;
});
const keys={};
window.addEventListener("keydown", e=>{ keys[e.code]=true; });
window.addEventListener("keyup",   e=>{ keys[e.code]=false; });

function limitTiltMag(tx, ty) {
  const m = Math.hypot(tx, ty);
  if (m > MAX_TILT_DEG) {
    const s = MAX_TILT_DEG / m;
    return { tx: tx * s, ty: ty * s };
  }
  return { tx, ty };
}
function applyPhysicalDeadZone(tx, ty, dead) {
  const m = Math.hypot(tx, ty);
  if (m < 1e-6) return { tx: 0, ty: 0 };
  const s = Math.min(1, m / dead);
  const k = s * s * (3 - 2 * s);
  return { tx: tx * k, ty: ty * k };
}
function currentTilt(){
  if(sensorState.motionEnabled && sensorState.baseSet){
    const s = sensorTilt();
    if (s) {
      const dead = Math.max(MIN_DEAD_DEG, Math.min(sensX, sensY) * DEAD_FRAC);
      const d = applyPhysicalDeadZone(s.tx, s.ty, dead);
      let tx = d.tx / Math.max(sensX, 0.1) * MAX_TILT_DEG;
      let ty = d.ty / Math.max(sensY, 0.1) * MAX_TILT_DEG;
      if (invertX) tx = -tx;
      if (invertY) ty = -ty;
      const mag = Math.hypot(tx, ty);
      if (mag < 0.3) return { tx: 0, ty: 0 };
      return limitTiltMag(tx, ty);
    }
  }
  let mx=mouse.active?mouse.x:0, my=mouse.active?mouse.y:0;
  if(keys.KeyA||keys.ArrowLeft)  mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(keys.KeyW||keys.ArrowUp)    my-=1;
  if(keys.KeyS||keys.ArrowDown)  my+=1;
  mx=clamp(mx,-1,1); my=clamp(my,-1,1);
  const mag = Math.hypot(mx, my);
  if(mag < DEAD_ZONE) return {tx:0,ty:0};
  if(mag > 1){ mx /= mag; my /= mag; }
  return { tx: mx*MAX_TILT_DEG, ty: my*MAX_TILT_DEG };
}

//  WebGPU init
// ===========================================================================
const canvas=document.getElementById("canvas");
if(!("gpu" in navigator)){ alert("WebGPU не поддерживается"); throw new Error("no webgpu"); }
const adapter=await navigator.gpu.requestAdapter();
if(!adapter){ alert("WebGPU: адаптер не найден"); throw new Error("no adapter"); }
const device=await adapter.requestDevice();
const context=canvas.getContext("webgpu");
const format=navigator.gpu.getPreferredCanvasFormat();

let depthTex=null, msaaTex=null;
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  canvas.width=Math.floor(window.innerWidth*dpr);
  canvas.height=Math.floor(window.innerHeight*dpr);
  context.configure({ device, format, alphaMode:"opaque" });
  const aspect = canvas.width / Math.max(canvas.height, 1);
  camHeight = isTouchPrimary ? CAM_HEIGHT_TOUCH : CAM_HEIGHT_BASE;
  const minHorizWorld = MIN_HORIZ_CELLS * CELL;
  const vertExtent = minHorizWorld / Math.max(aspect, 0.1);
  const neededTan = vertExtent / (2 * camHeight);
  const neededFovDeg = 2 * Math.atan(neededTan) * 180 / Math.PI;
  fovDeg = Math.max(FOV_DEG_BASE, Math.min(neededFovDeg, FOV_DEG_MAX));
  if(depthTex) depthTex.destroy();

  depthTex=device.createTexture({

    usage:GPUTextureUsage.RENDER_ATTACHMENT

}

// Wall mask texture
const wallTexData = new Uint8Array(WALL_TEX_SIZE * WALL_TEX_SIZE);
const wallTex = device.createTexture({
  size: [WALL_TEX_SIZE, WALL_TEX_SIZE],
  format: "r8unorm",
  usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
});
let lastBallCellX = null, lastBallCellZ = null;
let lastTexCellX = null, lastTexCellZ = null, lastTexDestroyedCount = -1;

function updateWallTex(ballX, ballZ) {
  const cx = Math.floor(ballX / CELL);
  const cz = Math.floor(ballZ / CELL);
  lastBallCellX = cx;
  lastBallCellZ = cz;
  if (cx === lastTexCellX && cz === lastTexCellZ && destroyedWalls.size === lastTexDestroyedCount) return;
  lastTexCellX = cx; lastTexCellZ = cz;
  lastTexDestroyedCount = destroyedWalls.size;
  for (let dz = 0; dz < WALL_TEX_SIZE; dz++) {
    const wz = cz + dz - WALL_TEX_HALF;
    const rowBase = dz * WALL_TEX_SIZE;
    for (let dx = 0; dx < WALL_TEX_SIZE; dx++) {
      const wx = cx + dx - WALL_TEX_HALF;
      wallTexData[rowBase + dx] = isSolidWithDestroyed(wx, wz) ? 255 : 0;
    }
  }
  device.queue.writeTexture(
    { texture: wallTex }, wallTexData,
    { bytesPerRow: WALL_TEX_SIZE }, [WALL_TEX_SIZE, WALL_TEX_SIZE]
  );
}

// Biome texture
const biomeTexData = new Uint8Array(WALL_TEX_SIZE * WALL_TEX_SIZE * 4);
const biomeDistBuf = new Float32Array(WALL_TEX_SIZE * WALL_TEX_SIZE);
const biomeTex = device.createTexture({
  size: [WALL_TEX_SIZE, WALL_TEX_SIZE],
  format: "rgba8unorm",
  usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
});
let lastBiomeCX = null, lastBiomeCZ = null, biomeVersion = 0, lastBiomeVersion = -1;

function paintBiome(sx, sz, cx, cz) {
  const hue = (hashSeed(sx, sz, (SEED ^ 0xB10E) >>> 0) & 0xFFFF) / 65535;
  const paletteIdx = Math.floor(hue * BIOME_PALETTE.length) % BIOME_PALETTE.length;
  const [r, g, b] = BIOME_PALETTE[paletteIdx];
  for (let dz = -SPECIAL_WALL_RADIUS; dz <= SPECIAL_WALL_RADIUS; dz++) {
    for (let dx = -SPECIAL_WALL_RADIUS; dx <= SPECIAL_WALL_RADIUS; dx++) {
      if (dx*dx + dz*dz > SPECIAL_WALL_RADIUS * SPECIAL_WALL_RADIUS) continue;
      const wx = sx + dx, wz = sz + dz;
      const px = wx - cx + WALL_TEX_HALF;
      const pz = wz - cz + WALL_TEX_HALF;
      if (px < 0 || px >= WALL_TEX_SIZE || pz < 0 || pz >= WALL_TEX_SIZE) continue;
      const idx = pz * WALL_TEX_SIZE + px;
      const d = dx*dx + dz*dz;
      if (d < biomeDistBuf[idx]) {
        biomeDistBuf[idx] = d;
        biomeTexData[idx * 4]     = r;
        biomeTexData[idx * 4 + 1] = g;
        biomeTexData[idx * 4 + 2] = b;
        biomeTexData[idx * 4 + 3] = 255;
      }
    }
  }
}
function updateBiomeTex(ballX, ballZ) {
  const cx = Math.floor(ballX / CELL);
  const cz = Math.floor(ballZ / CELL);
  if (cx === lastBiomeCX && cz === lastBiomeCZ && biomeVersion === lastBiomeVersion) return;
  lastBiomeCX = cx; lastBiomeCZ = cz;
  lastBiomeVersion = biomeVersion;
  for (let i = 0; i < WALL_TEX_SIZE * WALL_TEX_SIZE; i++) {
    biomeTexData[i * 4]     = 127;
    biomeTexData[i * 4 + 1] = 127;
    biomeTexData[i * 4 + 2] = 127;
    biomeTexData[i * 4 + 3] = 255;
    biomeDistBuf[i] = 1e9;
  }
  for (let sz = cz - WALL_TEX_HALF - SPECIAL_WALL_RADIUS; sz <= cz + WALL_TEX_HALF + SPECIAL_WALL_RADIUS; sz++) {
    for (let sx = cx - WALL_TEX_HALF - SPECIAL_WALL_RADIUS; sx <= cx + WALL_TEX_HALF + SPECIAL_WALL_RADIUS; sx++) {
      if (!isSpecialWall(sx, sz)) continue;
      paintBiome(sx, sz, cx, cz);
    }
  }
  device.queue.writeTexture(
    { texture: biomeTex }, biomeTexData,
    { bytesPerRow: WALL_TEX_SIZE * 4 }, [WALL_TEX_SIZE, WALL_TEX_SIZE]
  );
}

const WGSL = `
struct Globals {
  view    : mat4x4<f32>,
  proj    : mat4x4<f32>,
  camPos  : vec3<f32>,
  _pad0   : f32,
  ballPos : vec3<f32>,
  _pad1   : f32,
  rot0    : vec3<f32>,
  _pad2   : f32,
  rot1    : vec3<f32>,
  _pad3   : f32,
  rot2    : vec3<f32>,
  _pad4   : f32,
  ballCellX : i32,
  ballCellZ : i32,
  invertState : f32,
  invertFlash : f32,
  time : f32,
  _pad5 : f32,
  _pad6 : f32,
  _pad7 : f32,
};
@group(0) @binding(0) var<uniform> G : Globals;
@group(0) @binding(1) var wallTex : texture_2d<f32>;
@group(0) @binding(2) var biomeTex : texture_2d<f32>;

struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) nrm  : vec3<f32>,
  @location(1) wpos : vec3<f32>,
  @location(2) matW : vec4<f32>,
  @location(3) local: vec3<f32>,
  @location(4) kind : f32,
  @location(5) ndc  : vec2<f32>,
  @location(6) isz  : vec3<f32>,
};

@vertex
fn vs_maze(
  @location(0) cp : vec3<f32>,
  @location(1) cn : vec3<f32>,
  @location(2) ip : vec4<f32>,
  @location(3) is : vec4<f32>,
  @location(4) ic : vec4<f32>
) -> VOut {
  var o : VOut;
  let w = ip.xyz + cp * is.xyz;
  o.wpos = w;
  o.nrm  = cn;
  o.matW = ic;
  o.local = cp;
  o.kind = 0.0;
  o.isz  = is.xyz;
  o.pos  = G.proj * (G.view * vec4<f32>(w, 1.0));
  o.ndc  = o.pos.xy / o.pos.w;
  return o;
}

@vertex
fn vs_ball(
  @location(0) sp : vec3<f32>,
  @location(1) sn : vec3<f32>
) -> VOut {
  var o : VOut;
  let R = mat3x3<f32>(G.rot0, G.rot1, G.rot2);
  let local = R * sp;
  let w = G.ballPos + local * ${BALL_R.toFixed(4)};
  o.wpos = w;
  o.nrm  = R * sn;
  o.matW = vec4<f32>(0.0);
  o.local = sp;
  o.kind = 1.0;
  o.isz  = vec3<f32>(0.0);
  o.pos  = G.proj * (G.view * vec4<f32>(w, 1.0));
  o.ndc  = o.pos.xy / o.pos.w;

}

@vertex
fn vs_particle(
  @location(0) cp : vec3<f32>,
  @location(1) cn : vec3<f32>,
  @location(2) ip : vec4<f32>,
  @location(3) is : vec4<f32>,
  @location(4) ic : vec4<f32>
) -> VOut {
  var o : VOut;
  let w = ip.xyz + cp * is.xyz;
  o.wpos = w;
  o.nrm  = cn;
  o.matW = ic;
  o.local = cp;
  o.kind = 2.0;
  o.isz  = is.xyz;
  o.pos  = G.proj * (G.view * vec4<f32>(w, 1.0));

@vertex
fn vs_crystal(
  @location(0) cp : vec3<f32>,
  @location(1) cn : vec3<f32>,
  @location(2) ip : vec4<f32>,
  @location(3) is : vec4<f32>,
  @location(4) ic : vec4<f32>
) -> VOut {
  var o : VOut;
  let phase = ic.w * 6.2831853;
  let ang = G.time * 2.5 + phase;
  let s = sin(ang);
  let c = cos(ang);
  let rp = vec3<f32>(cp.x * c + cp.z * s, cp.y, -cp.x * s + cp.z * c);
  let rn = vec3<f32>(cn.x * c + cn.z * s, cn.y, -cn.x * s + cn.z * c);
  let w = ip.xyz + rp * is.xyz;
  o.wpos = w;
  o.nrm  = rn;
  o.matW = ic;
  o.local = cp;
  o.kind = 3.0;
  o.isz  = is.xyz;
  o.pos  = G.proj * (G.view * vec4<f32>(w, 1.0));
  o.ndc  = o.pos.xy / o.pos.w;
  return o;
}

fn hash31(p: vec3<f32>) -> f32 {
  var q = fract(p * 0.3183099 + vec3<f32>(0.11, 0.17, 0.13));
  q = q * (q + 33.33);
  return fract((q.x + q.y) * q.z);
}
fn vnoise(p: vec3<f32>) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let x00 = mix(hash31(i), hash31(i + vec3<f32>(1,0,0)), u.x);
  let x10 = mix(hash31(i + vec3<f32>(0,1,0)), hash31(i + vec3<f32>(1,1,0)), u.x);
  let x01 = mix(hash31(i + vec3<f32>(0,0,1)), hash31(i + vec3<f32>(1,0,1)), u.x);
  let x11 = mix(hash31(i + vec3<f32>(0,1,1)), hash31(i + vec3<f32>(1,1,1)), u.x);
  return mix(mix(x00, x10, u.y), mix(x01, x11, u.y), u.z);
}
fn fbm2(p: vec3<f32>) -> f32 {
  return vnoise(p) * 0.65 + vnoise(p * 2.7) * 0.35;
}
fn mazeSolid(x: i32, z: i32) -> bool {
  let dx = x - G.ballCellX + ${WALL_TEX_HALF};
  let dz = z - G.ballCellZ + ${WALL_TEX_HALF};
  if (dx < 0 || dx >= ${WALL_TEX_SIZE} || dz < 0 || dz >= ${WALL_TEX_SIZE}) { return false; }
  return textureLoad(wallTex, vec2<i32>(dx, dz), 0).r > 0.5;
}
fn biomeTintAt(cellX: i32, cellZ: i32) -> vec3<f32> {
  let relX = cellX - G.ballCellX + ${WALL_TEX_HALF};
  let relZ = cellZ - G.ballCellZ + ${WALL_TEX_HALF};
  if (relX < 0 || relX >= ${WALL_TEX_SIZE} || relZ < 0 || relZ >= ${WALL_TEX_SIZE}) {
    return vec3<f32>(1.0);
  }
  let s = textureLoad(biomeTex, vec2<i32>(relX, relZ), 0).rgb;
  return 0.6 + s * 0.8;
}
fn floorProximity(p: vec3<f32>) -> f32 {
  let c = floor(p.xz / ${CELL.toFixed(2)});
  var dmin = 1e9;
  for (var dz = -1; dz <= 1; dz++) {
    for (var dx = -1; dx <= 1; dx++) {
      let cx = i32(c.x) + dx; let cz = i32(c.y) + dz;
      if (mazeSolid(cx, cz)) {
        let mn = vec2<f32>(f32(cx), f32(cz)) * ${CELL.toFixed(2)};
        let mx = mn + vec2<f32>(${CELL.toFixed(2)});
        let q = max(mn - p.xz, p.xz - mx);
        let qq = max(q, vec2<f32>(0.0));
        dmin = min(dmin, qq.x * qq.x + qq.y * qq.y);
      }
    }
  }
  return sqrt(dmin);
}
fn rayHitsAABB(p: vec3<f32>, dir: vec3<f32>, mn: vec3<f32>, mx: vec3<f32>) -> bool {
  if (all(p >= mn) && all(p <= mx)) { return true; }
  let absDir = abs(dir);
  let eps = 1e-8;
  if (absDir.x < eps) { if (p.x < mn.x || p.x > mx.x) { return false; } }
  if (absDir.y < eps) { if (p.y < mn.y || p.y > mx.y) { return false; } }
  if (absDir.z < eps) { if (p.z < mn.z || p.z > mx.z) { return false; } }
  let inv = 1.0 / dir;
  let tv0 = (mn - p) * inv;
  let tv1 = (mx - p) * inv;
  let t0 = min(tv0, tv1);
  let t1 = max(tv0, tv1);
  let tNear = max(max(t0.x, t0.y), t0.z);
  let tFar  = min(min(t1.x, t1.y), t1.z);
  return tFar >= max(tNear, 0.0);
}
fn wallShadow(p: vec3<f32>, L: vec3<f32>) -> f32 {
  let c = vec2<i32>(floor(p.xz / ${CELL.toFixed(2)}));
  let pSafe = vec3<f32>(p.x, max(p.y, 0.001), p.z);
  var lit: f32 = 0.0;
  for (var i = 0; i < 8; i++) {
    let fi = f32(i);
    let ang = fi * 2.39996323;
    let rad = sqrt((fi + 0.5) / 8.0) * 0.18;
    let jitter = vec3<f32>(cos(ang) * rad, 0.0, sin(ang) * rad);
    let dir = normalize(L + jitter);
    var blocked = false;
    for (var dz = 0; dz <= 1; dz++) {
      for (var dx = 0; dx <= 1; dx++) {
        if (dx == 0 && dz == 0) { continue; }
        let cx = c.x + dx;
        let cz = c.y + dz;
        if (!mazeSolid(cx, cz)) { continue; }
        let mn = vec3<f32>(f32(cx) * ${CELL.toFixed(2)}, 0.0, f32(cz) * ${CELL.toFixed(2)});
        let mx = mn + vec3<f32>(${CELL.toFixed(2)}, ${WALL_H.toFixed(2)}, ${CELL.toFixed(2)});
        if (rayHitsAABB(pSafe, dir, mn, mx)) { blocked = true; break; }
      }
      if (blocked) { break; }
    }
    if (!blocked) { lit += 1.0; }
  }
  return lit / 8.0;
}
fn roundedNormal(i: VOut, radius: f32) -> vec3<f32> {
  let half = i.isz * 0.5;
  let lc = (i.local - 0.5) * i.isz;
  let q = max(abs(lc) - half + vec3<f32>(radius), vec3<f32>(0.0));
  let sn = vec3<f32>(sign(lc.x), sign(lc.y), sign(lc.z));
  let nr = sn * q;
  let l = length(nr);
  if (l < 1e-6) { return normalize(i.nrm); }
  return nr / l;
}
fn envColor(rd: vec3<f32>, L: vec3<f32>) -> vec3<f32> {
  let up = smoothstep(-0.05, 0.5, rd.y);
  let sky = mix(vec3<f32>(0.045,0.065,0.11), vec3<f32>(0.16,0.24,0.40), up);
  let ground = mix(vec3<f32>(0.03,0.045,0.08), sky, smoothstep(-0.4, -0.02, rd.y));
  var c = mix(ground, sky, up);
  c += vec3<f32>(1.0,0.95,0.85) * pow(max(dot(rd, L), 0.0), 240.0) * 5.0;
  c += vec3<f32>(0.20,0.28,0.45) * exp(-abs(rd.y) * 7.0) * 0.35;
  c += vec3<f32>(0.05,0.02,0.10) * smoothstep(0.3, 0.9, rd.y);
  return c;
}
fn tileHash(ti: vec2<i32>) -> f32 {
  return hash31(vec3<f32>(f32(ti.x), 0.0, f32(ti.y)));
}
fn inBox(p: vec2<f32>, mn: vec2<f32>, mx: vec2<f32>) -> f32 {
  let q = max(mn - p, p - mx);
  let dist = max(max(q.x, q.y), 0.0);
  return 1.0 - smoothstep(0.0, 0.008, dist);
}
fn sevenSegAt(uv: vec2<f32>, digit: i32) -> f32 {
  let a = inBox(uv, vec2<f32>(0.20, 0.20), vec2<f32>(0.80, 0.30));
  let b = inBox(uv, vec2<f32>(0.70, 0.20), vec2<f32>(0.80, 0.50));
  let c = inBox(uv, vec2<f32>(0.70, 0.50), vec2<f32>(0.80, 0.80));
  let d = inBox(uv, vec2<f32>(0.20, 0.70), vec2<f32>(0.80, 0.80));
  let e = inBox(uv, vec2<f32>(0.20, 0.50), vec2<f32>(0.30, 0.80));
  let f = inBox(uv, vec2<f32>(0.20, 0.20), vec2<f32>(0.30, 0.50));
  let g = inBox(uv, vec2<f32>(0.20, 0.45), vec2<f32>(0.80, 0.55));
  var m = 0.0;
  switch (digit) {
    case 0: { m = max(max(a, b), max(max(c, d), max(e, f))); }
    case 1: { m = max(b, c); }
    case 2: { m = max(max(a, b), max(g, max(e, d))); }
    case 3: { m = max(max(a, b), max(g, max(c, d))); }
    case 4: { m = max(max(f, g), max(b, c)); }
    case 5: { m = max(max(a, f), max(g, max(c, d))); }
    case 6: { m = max(max(a, f), max(g, max(e, max(c, d)))); }
    case 7: { m = max(a, max(b, c)); }
    case 8: { m = max(max(a, b), max(max(c, d), max(e, max(f, g)))); }
    case 9: { m = max(max(a, b), max(max(c, d), max(f, g))); }
    default: { m = 0.0; }
  }
  return m;
}
fn sevenSegCount(uv: vec2<f32>, count: i32) -> f32 {
  if (count < 10) { return sevenSegAt(uv, count); }
  let tens = (count / 10) % 10;
  let units = count % 10;
  if (uv.x < 0.5) { return sevenSegAt(vec2<f32>(uv.x * 2.0, uv.y), tens); }
  else { return sevenSegAt(vec2<f32>((uv.x - 0.5) * 2.0, uv.y), units); }
}
fn digitColor(d: i32) -> vec3<f32> {
  switch d {
    case 1: { return vec3<f32>(0.35, 0.75, 1.0); }
    case 2: { return vec3<f32>(0.30, 1.00, 0.40); }
    case 3: { return vec3<f32>(1.00, 0.35, 0.30); }
    case 4: { return vec3<f32>(0.85, 0.35, 1.00); }
    case 5: { return vec3<f32>(1.00, 0.65, 0.20); }
    case 6: { return vec3<f32>(0.20, 0.95, 0.95); }
    case 7: { return vec3<f32>(1.00, 1.00, 1.00); }
    case 8: { return vec3<f32>(0.75, 0.75, 0.80); }
    case 9: { return vec3<f32>(1.00, 0.90, 0.30); }
    default: { return vec3<f32>(0.6, 0.6, 0.6); }
  }
}

@fragment
fn fs_main(i : VOut) -> @location(0) vec4<f32> {
  let L = normalize(vec3<f32>(30.0, 50.0, 22.0));
  let Vv = normalize(G.camPos - i.wpos);
  let dist = distance(G.camPos, i.wpos);
  let fogF = clamp(exp(-pow(dist * 0.018, 2.0)), 0.0, 1.0);
  var col : vec3<f32>;
  var glow : vec3<f32> = vec3<f32>(0.0);

  if (i.kind > 2.5) {
    let n = normalize(i.nrm);
    let ndl = max(dot(n, L), 0.0);
    let fres = pow(1.0 - max(dot(n, Vv), 0.0), 2.0);
    let baseCol = vec3<f32>(0.1, 0.75, 1.0);
    let rimCol = vec3<f32>(0.7, 0.95, 1.0);
    let pulse = 0.85 + 0.15 * sin(G.time * 4.0);
    let facetVar = 0.7 + 0.3 * sin(i.local.y * 10.0 + i.local.x * 5.0 + G.time * 3.0);
    var cc = baseCol * (0.6 + 0.6 * ndl) * facetVar * pulse;
    cc += rimCol * fres * 3.0 * pulse;
    cc += baseCol * 0.5;
    cc = mix(vec3<f32>(0.0), cc, fogF);
    return vec4<f32>(cc, 1.0);
  } else if (i.kind > 1.5) {
    let t = i.matW.a;
    let c = i.matW.rgb;
    let n = normalize(i.nrm);
    let light = 0.75 + 0.25 * max(dot(n, L), 0.0);
    var pc = c * light;
    pc = mix(vec3<f32>(0.0), pc, fogF);
    return vec4<f32>(pc, t);
  } else if (i.kind > 0.5) {
    let Rm = mat3x3<f32>(G.rot0, G.rot1, G.rot2);
    let a = vec3<f32>(11.0, 7.0, 13.0);
    let g1 = cos(dot(i.local, a)) * a;
    let g1t = g1 - i.local * dot(g1, i.local);
    let b = vec3<f32>(-7.0, 15.0, -9.0);
    let g2 = cos(dot(i.local, b) * 0.7) * (b * 0.7);
    let g2t = g2 - i.local * dot(g2, i.local);
    let n = normalize(Rm * normalize(i.local + (g1t + g2t) * 0.016));
    let cosV = clamp(dot(n, Vv), 0.0, 1.0);
    let fresnel = 0.04 + 0.96 * pow(1.0 - cosV, 5.0);
    let R = reflect(-Vv, n);
    var refl = envColor(R, L);
    refl += vec3<f32>(1.0, 0.94, 0.84) * pow(max(dot(R, L), 0.0), 500.0) * 5.5;
    let hv = normalize(L + Vv);
    refl += vec3<f32>(1.0, 0.97, 0.92) * pow(max(dot(n, hv), 0.0), 300.0) * 2.2;
    let studioL = normalize(vec3<f32>(-0.4, 0.5, -0.4));
    refl += vec3<f32>(0.65, 0.55, 0.95) * pow(max(dot(R, studioL), 0.0), 60.0) * 0.55;
    refl += vec3<f32>(0.10, 0.05, 0.22) * max(-n.y, 0.0);
    let thick = 2.0 * pow(cosV, 0.8);
    var absorbCol = vec3<f32>(1.6, 3.8, 1.1);
    if (G.invertState > 0.5) { absorbCol = vec3<f32>(4.0, 2.5, 0.6); }
    let absorb = exp(-thick * absorbCol);

  }
  const playerX = ball.x / CELL, playerZ = ball.z / CELL;
  const ppx = halfW + (playerX - centerCellX) * scale - panX;
  const ppy = halfH + (playerZ - centerCellZ) * scale - panY;
  ctx.beginPath();
  ctx.arc(ppx, ppy, Math.max(3, scale * 0.3), 0, Math.PI * 2);
  ctx.fillStyle = isInverted ? "#00d4ff" : "#8c5aff";
  ctx.fill();
  ctx.lineWidth = Math.max(1, scale * 0.05);
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
}

function updateMinimap() {
  if (!minimapVisible) return;
  const px = Math.floor(ball.x / CELL);
  const pz = Math.floor(ball.z / CELL);
  const R = 5;
  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      if (dx*dx + dz*dz <= R*R) visitedCells.add(`${px+dx},${pz+dz}`);
    }
  }
  const scale = minimapSize / 21;
  drawMapOnCanvas(minimapCtx, minimapSize, minimapSize, px + 0.5, pz + 0.5, scale, 0, 0);
  if (mapOpen) {
    const fullScale = 40 * fullZoom;
    drawMapOnCanvas(fullCtx, fullCanvas.width, fullCanvas.height, px + 0.5, pz + 0.5, fullScale, fullPanX, fullPanY);
  }
}

async function requestPermissionsAndStart() {
  initAudio();
  requestWakeLock();
  let pr = Promise.resolve("granted");
  if ("DeviceMotionEvent" in window && typeof DeviceMotionEvent.requestPermission === "function")
    pr = DeviceMotionEvent.requestPermission();
  try {
    const res = await pr;
    if ((res === "granted" || res === undefined) && "DeviceMotionEvent" in window)
      window.addEventListener("devicemotion", onMotion);
    if (res === "granted") sensorState.motionEnabled = true;
  } catch(e) {}
}

  const saves = await dbAll();
  if (saves.length === 0) return;
  saves.sort((a, b) => b.timestamp - a.timestamp);
  const ok = await loadSaveById(saves[0].id);
  if (!ok) return;
  await requestPermissionsAndStart();
  hideOverlay();
  closeMenu();
}

function cancelPress(){
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }

  const wasTap = pressActive && !pressFired;
  cancelPress();

  const bottomZoneTop = window.innerHeight * (1 - BOTTOM_ZONE_FRAC);
  const isBottomZone = e.clientY > bottomZoneTop;

  if (!isBottomZone && inversionCharges > 0) {
    isInverted = !isInverted;
    invertFlash = 1.0;
    playToggleSound();
    for (let i = 0; i < 20; i++) {
      const ang = Math.random() * Math.PI * 2;

      spawnParticle(ball.x, BALL_R, ball.z, Math.cos(ang) * spd, Math.random() * 5, Math.sin(ang) * spd, 0.1, 0.0, 0.8, 1.0, 0.6);
    }
    lastTapTime = 0;
    return;
  }

  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_MS) {
    recalibrateTilt();
    lastTapTime = 0;
  } else {
    lastTapTime = now;
  }
});

// ===========================================================================
//  Minimap interaction
// ===========================================================================
function scheduleMinimapSave() {
  if (mmSaveTimer) clearTimeout(mmSaveTimer);
  mmSaveTimer = setTimeout(() => { mmSaveTimer = null; saveSettingsToStorage(); }, 200);
}
function flushMinimapSave() {
  if (mmSaveTimer) { clearTimeout(mmSaveTimer); mmSaveTimer = null; }
  saveSettingsToStorage();
}
function forceEndMinimapDrag() {
  if (!mmDrag) return;
  const d = mmDrag;
  mmDrag = null;
  try { minimapWrap.releasePointerCapture(d.id); } catch(_) {}
  if (d.moved) layoutMinimap();
}
function finalizeMinimapGestures() {
  forceEndMinimapDrag();
  finishMinimapResize();
  flushMinimapSave();
}
window.addEventListener("pointerdown", () => {
  if (mmDrag || mmResize) finalizeMinimapGestures();
}, true);
window.addEventListener("blur", finalizeMinimapGestures);
window.addEventListener("pagehide", finalizeMinimapGestures);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") finalizeMinimapGestures();
});

minimapWrap.addEventListener("pointerdown", e => {
  e.preventDefault();
  e.stopPropagation();
  if (mmDrag || mmResize) return;
  const rect = minimapWrap.getBoundingClientRect();
  mmDrag = {
    id: e.pointerId,
    grabX: e.clientX - rect.left,
    grabY: e.clientY - rect.top,
    startX: e.clientX, startY: e.clientY,
    startT: performance.now(),
    moved: false
  };
  try { minimapWrap.setPointerCapture(e.pointerId); } catch(_) {}
});
minimapWrap.addEventListener("pointermove", e => {
  if (!mmDrag || e.pointerId !== mmDrag.id) return;
  if (e.pointerType === "mouse" && e.buttons === 0) { endMinimapDrag(e, false); return; }
  e.preventDefault();
  if (!mmDrag.moved) {
    if (Math.abs(e.clientX - mmDrag.startX) < 6 && Math.abs(e.clientY - mmDrag.startY) < 6) return;
    mmDrag.moved = true;
  }
  const b = getMinimapBounds();
  const maxLeft = b.vw - minimapSize - b.mR;
  const maxTop = b.vh - minimapSize - b.mB;
  const left = Math.max(b.mL, Math.min(maxLeft, e.clientX - mmDrag.grabX));
  const top = Math.max(b.mT, Math.min(maxTop, e.clientY - mmDrag.grabY));
  minimapWrap.style.left = left + "px";
  minimapWrap.style.top = top + "px";
  const f = minimapFractionsFromPixel(left, top, minimapSize, b);
  minimapFx = f.fx; minimapFy = f.fy;
  scheduleMinimapSave();
});
function endMinimapDrag(e, allowTap) {
  if (!mmDrag || e.pointerId !== mmDrag.id) return;
  const d = mmDrag;
  mmDrag = null;
  try { minimapWrap.releasePointerCapture(d.id); } catch(_) {}
  if (d.moved) {
    layoutMinimap();
    flushMinimapSave();
  } else if (allowTap && performance.now() - d.startT < 350) {
    openFullscreenMap();
  }
}
minimapWrap.addEventListener("pointerup", e => endMinimapDrag(e, true));
minimapWrap.addEventListener("pointercancel", e => endMinimapDrag(e, false));
minimapWrap.addEventListener("lostpointercapture", e => endMinimapDrag(e, false));

// --- Resize: захват на стабильном оверлее, размер пишется сразу ---
minimapGrip.addEventListener("pointerdown", e => {
  e.preventDefault();
  e.stopPropagation();
  if (mmDrag || mmResize) return;
  mmResize = {
    id: e.pointerId,
    pointerType: e.pointerType || "mouse",
    startX: e.clientX,
    startY: e.clientY,
    startSize: minimapSize
  };
  minimapResizeOverlay.style.display = "block";
  try { minimapResizeOverlay.setPointerCapture(e.pointerId); } catch(_) {}
});
function applyMinimapResizeFromPointer(e) {
  if (!mmResize || e.pointerId !== mmResize.id) return;
  if (e.pointerType === "mouse" && e.buttons === 0) { finishMinimapResize(); return; }
  e.preventDefault();
  const b = getMinimapBounds();
  const delta = Math.max(e.clientX - mmResize.startX, e.clientY - mmResize.startY);
  const newSize = Math.round(Math.min(b.maxSize, Math.max(80, mmResize.startSize + delta)));
  if (newSize === minimapSize) return;
  const rect = minimapWrap.getBoundingClientRect();
  minimapSize = newSize;
  const maxLeft = b.vw - minimapSize - b.mR;
  const maxTop = b.vh - minimapSize - b.mB;
  const left = Math.max(b.mL, Math.min(maxLeft, rect.left));
  const top = Math.max(b.mT, Math.min(maxTop, rect.top));
  const f = minimapFractionsFromPixel(left, top, minimapSize, b);
  minimapFx = f.fx; minimapFy = f.fy;
  layoutMinimap();
  saveSettingsToStorage();
}
function finishMinimapResize() {
  if (!mmResize) return;
  const r = mmResize;
  mmResize = null;
  try { minimapResizeOverlay.releasePointerCapture(r.id); } catch(_) {}
  minimapResizeOverlay.style.display = "none";
  layoutMinimap();
  saveSettingsToStorage();
}
minimapResizeOverlay.addEventListener("pointermove", applyMinimapResizeFromPointer);
minimapResizeOverlay.addEventListener("pointerup", e => {
  if (mmResize && e.pointerId === mmResize.id) {
    e.preventDefault();
    finishMinimapResize();
  }
});
minimapResizeOverlay.addEventListener("pointercancel", e => {
  if (mmResize && e.pointerId === mmResize.id) finishMinimapResize();
});
minimapResizeOverlay.addEventListener("lostpointercapture", () => finishMinimapResize());
// Страховки на случай потери событий указателя
window.addEventListener("pointerup", e => {
  if (mmResize && e.pointerId === mmResize.id) finishMinimapResize();
}, true);
window.addEventListener("pointercancel", e => {
  if (mmResize && e.pointerId === mmResize.id) finishMinimapResize();
}, true);
window.addEventListener("touchend", () => {
  if (mmResize && mmResize.pointerType !== "mouse") finishMinimapResize();
}, { capture:true, passive:true });
window.addEventListener("touchcancel", () => {
  if (mmResize && mmResize.pointerType !== "mouse") finishMinimapResize();
}, { capture:true, passive:true });
window.addEventListener("mouseup", () => {
  if (mmResize && mmResize.pointerType === "mouse") finishMinimapResize();
}, true);

// ===========================================================================
//  Fullscreen map
// ===========================================================================
let isPanning = false;
let lastPanX = 0, lastPanY = 0;
let touchDist = 0;
let fullMapDragDist = 0;
let fullMapTapStart = 0;
let fullMapTapX = 0, fullMapTapY = 0;
const fullMapPointers = new Map();

fullMapEl.addEventListener("pointerdown", e => {
  fullMapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fullMapPointers.size === 1) {
    isPanning = true;
    lastPanX = e.clientX;
    lastPanY = e.clientY;
    fullMapDragDist = 0;
    fullMapTapStart = performance.now();
    fullMapTapX = e.clientX;
    fullMapTapY = e.clientY;
  } else {
    isPanning = false;
    const pts = [...fullMapPointers.values()];
    touchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
});
fullMapEl.addEventListener("pointermove", e => {
  const p = fullMapPointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX;
  p.y = e.clientY;
  if (fullMapPointers.size === 1 && isPanning) {
    const dx = e.clientX - lastPanX;
    const dy = e.clientY - lastPanY;
    fullMapDragDist += Math.abs(dx) + Math.abs(dy);
    fullPanX -= dx;
    fullPanY -= dy;
    lastPanX = e.clientX;
    lastPanY = e.clientY;
  } else if (fullMapPointers.size === 2 && touchDist > 0) {
    const pts = [...fullMapPointers.values()];
    const newDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (newDist > 0) {
      fullZoom *= newDist / touchDist;
      fullZoom = Math.max(0.3, Math.min(10, fullZoom));
      touchDist = newDist;
    }
  }
});
fullMapEl.addEventListener("pointerup", e => {
  fullMapPointers.delete(e.pointerId);
  if (fullMapPointers.size === 0) {
    const dt = performance.now() - fullMapTapStart;
    const dx = Math.abs(e.clientX - fullMapTapX);
    const dy = Math.abs(e.clientY - fullMapTapY);
    if (dt < 300 && dx < 8 && dy < 8 && fullMapDragDist < 8 && touchDist === 0) {
      closeFullscreenMap();
    }
    isPanning = false;
    touchDist = 0;
  }
});
fullMapEl.addEventListener("pointercancel", e => {
  fullMapPointers.delete(e.pointerId);
  if (fullMapPointers.size === 0) { isPanning = false; touchDist = 0; }
});
fullMapEl.addEventListener("wheel", e => {
  e.preventDefault();
  fullZoom *= e.deltaY > 0 ? 0.9 : 1.1;
  fullZoom = Math.max(0.3, Math.min(10, fullZoom));
}, { passive: false });

// ===========================================================================
//  FPS
// ===========================================================================
let fpsAcc = 0, fpsFrames = 0;
function updateFps(dt) {
  fpsAcc += dt;
  fpsFrames++;
  if (fpsAcc >= 0.25) {
    fpsEl.textContent = `${(fpsFrames / fpsAcc).toFixed(0)} FPS`;
    fpsAcc = 0;
    fpsFrames = 0;
  }
}

// ===========================================================================
//  Main loop
// ===========================================================================
let lastTime = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  globalTime += dt;

  updateFps(dt);
  updateHpVisibility();
  updateScoreVisibility();

  const active = !overlayVisible && !menuVisible && !gameOver && !mapOpen && !infoModalOpen && !savesModalOpen;
  if (active) {
    stepBall(dt);
    updateParticles(dt);
    if (invertFlash > 0) invertFlash = Math.max(0, invertFlash - dt * 4);
  } else {
    for (const orb of bonusOrbs) orb.t += dt * 0.3;
  }

  if (shake > 0.01) shake *= Math.exp(-6 * dt); else shake = 0;

  const speedNow = Math.hypot(ball.vx, ball.vz);
  updateRollSound(speedNow, dt, active);

  updateWallTex(ball.x, ball.z);
  updateBiomeTex(ball.x, ball.z);
  updateMinimap();

  const sX = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const sZ = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const eye={ x:ball.x + sX, y:BALL_R+camHeight, z:ball.z+CAM_BACK + sZ };
  const target={ x:ball.x, y:BALL_R, z:ball.z };
  const aspect=canvas.width/canvas.height;
  const { v, p }=buildViewProj(eye,target,aspect);

  uboData.set(v,0);
  uboData.set(p,16);
  uboData[32]=eye.x; uboData[33]=eye.y; uboData[34]=eye.z; uboData[35]=0;
  uboData[36]=ball.x; uboData[37]=BALL_R; uboData[38]=ball.z; uboData[39]=0;
  uboData[40]=ballRot[0]; uboData[41]=ballRot[3]; uboData[42]=ballRot[6]; uboData[43]=0;
  uboData[44]=ballRot[1]; uboData[45]=ballRot[4]; uboData[46]=ballRot[7]; uboData[47]=0;
  uboData[48]=ballRot[2]; uboData[49]=ballRot[5]; uboData[50]=ballRot[8]; uboData[51]=0;
  uboDataU32[52] = lastBallCellX | 0;
  uboDataU32[53] = lastBallCellZ | 0;
  uboData[54] = isInverted ? 1.0 : 0.0;
  uboData[55] = invertFlash;
  uboData[56] = globalTime;
  device.queue.writeBuffer(ubo,0,uboData);

  buildInstances(ball.x, ball.z);
  device.queue.writeBuffer(instBuf,0,instData.subarray(0,instCount*12));
  buildParticleInstances();
  if (particleCount > 0) device.queue.writeBuffer(particleBuf,0,particleData.subarray(0,particleCount*12));
  buildCrystalInstances();
  if (crystalCount > 0) device.queue.writeBuffer(crystalInstBuf, 0, crystalInstData.subarray(0,crystalCount*12));

  const enc=device.createCommandEncoder();
  const pass=enc.beginRenderPass({
    colorAttachments:[{
      view: msaaTex.createView(),
      resolveTarget: context.getCurrentTexture().createView(),
      clearValue:{ r:0.015, g:0.02, b:0.045, a:1 },
      loadOp:"clear", storeOp:"discard"
    }],
    depthStencilAttachment:{
      view:depthTex.createView(),
      depthClearValue:1.0, depthLoadOp:"clear", depthStoreOp:"store"
    }
  });

  pass.setPipeline(mazePipeline);
  pass.setBindGroup(0,globalsBG);
  pass.setVertexBuffer(0,cubeBuf);
  pass.setVertexBuffer(1,instBuf);
  pass.setIndexBuffer(cubeIdxBuf,"uint16");
  pass.drawIndexed(cubeIdxCount, instCount, 0, 0, 0);

  pass.setPipeline(ballPipeline);
  pass.setBindGroup(0,globalsBG);
  pass.setVertexBuffer(0,sphereBuf);
  pass.setIndexBuffer(sphereIdxBuf,"uint16");
  pass.drawIndexed(sphereIdxCount, 1, 0, 0, 0);

  if (crystalCount > 0) {
    pass.setPipeline(crystalPipeline);
    pass.setBindGroup(0,globalsBG);
    pass.setVertexBuffer(0,crystalBuf);
    pass.setVertexBuffer(1,crystalInstBuf);
    pass.setIndexBuffer(crystalIdxBuf,"uint16");
    pass.drawIndexed(crystalIdxCount, crystalCount, 0, 0, 0);
  }

  if (particleCount > 0) {
    pass.setPipeline(particlePipeline);
    pass.setBindGroup(0,globalsBG);
    pass.setVertexBuffer(0,cubeBuf);
    pass.setVertexBuffer(1,particleBuf);
    pass.setIndexBuffer(cubeIdxBuf,"uint16");
    pass.drawIndexed(cubeIdxCount, particleCount, 0, 0, 0);
  }

  pass.end();
  device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

//  Init
// ===========================================================================

  await initDB();
  await updateSaveButtonsAvailability();
